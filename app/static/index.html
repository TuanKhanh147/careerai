<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerAI – Kết nối sinh viên & cơ hội nghề nghiệp</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1b2333;--mut:#667;--pri:#3a5bd9;--bd:#e3e7f0}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c26;--tx:#e8ecf5;--mut:#9aa4b8;--pri:#7b93ff;--bd:#2a3040}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font-size:18px;color:var(--pri)}nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.g.on{border-color:var(--pri);color:var(--pri)}
main{max-width:960px;margin:20px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
textarea{min-height:110px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;margin:2px;background:var(--bg);border:1px solid var(--bd)}
.ok{color:#1a8f4c}.no{color:#c0392b}.score{font-size:22px;font-weight:700;color:var(--pri)}
.out{white-space:pre-wrap;line-height:1.55}.mut{color:var(--mut);font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.auth{max-width:380px;margin:60px auto}.bar{height:8px;background:var(--bd);border-radius:9px}.bar i{display:block;height:8px;background:var(--pri);border-radius:9px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);let T=localStorage.getItem('t'),U=null,page='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,m='GET',b,form){
  const h={};if(T)h.Authorization='Bearer '+T;let body;
  if(form){body=new URLSearchParams(b)}else if(b){h['Content-Type']='application/json';body=JSON.stringify(b)}
  const r=await fetch('/api'+p,{method:m,headers:h,body});const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status==401&&T){logout();}throw new Error(typeof d.detail=='string'?d.detail:'Dữ liệu không hợp lệ')}return d}
function logout(){localStorage.removeItem('t');T=null;U=null;render()}
const tabs={student:[['jobs','Gợi ý việc làm'],['apps','Đơn ứng tuyển'],['profile','Hồ sơ & CV'],['cv','CV AI'],['skill','Kỹ năng'],['interview','Phỏng vấn'],['trends','Xu hướng'],['account','Tài khoản']],
 employer:[['myjobs','Tin tuyển dụng'],['trends','Xu hướng'],['profile','Hồ sơ'],['account','Tài khoản']],admin:[['users','Người dùng'],['myjobs','Tin tuyển dụng'],['trends','Xu hướng'],['account','Tài khoản']]};
async function render(){
  if(location.hash.startsWith("#reset="))return resetView();
  if(T&&!U){try{U=await api('/me')}catch(e){T=null}}
  if(!U){return authView()}
  if(!page||!tabs[U.role].some(t=>t[0]==page))page=tabs[U.role][0][0];
  $('#app').innerHTML=`<header><b>🎓 CareerAI</b><nav>${tabs[U.role].map(t=>`<button class="g ${t[0]==page?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>
  <span class="mut">${esc(U.name)} (${U.role})</span><button class="g" onclick="logout()">Đăng xuất</button></header><main id="m">Đang tải…</main>`;
  try{await views[page]()}catch(e){$('#m').innerHTML='<div class="card no">'+esc(e.message)+'</div>'}}
function go(p){page=p;render()}
let reg=false;
function authView(){$('#app').innerHTML=`<div class="card auth"><h2>🎓 CareerAI</h2><p class="mut">Nền tảng AI kết nối sinh viên với thực tập & việc làm</p>
 ${reg?'<label>Họ tên</label><input id="n"><label>Vai trò</label><select id="r"><option value="student">Sinh viên</option><option value="employer">Doanh nghiệp</option></select>':''}
 <label>Email</label><input id="e" type="email"><label>Mật khẩu</label><input id="p" type="password">
 <div id="er" class="no"></div><button style="width:100%" onclick="auth()">${reg?'Đăng ký':'Đăng nhập'}</button>
 ${reg?'':'<p class="mut" style="text-align:center;cursor:pointer" onclick="forgotView()">Quên mật khẩu?</p>'}<p class="mut" style="text-align:center;cursor:pointer" onclick="reg=!reg;authView()">${reg?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</p></div>`}
async function auth(){try{let d;
  if(reg)d=await api('/register','POST',{email:$('#e').value,name:$('#n').value,password:$('#p').value,role:$('#r').value});
  else{d=await api('/login','POST',{username:$('#e').value,password:$('#p').value},true);d.token=d.access_token}
  T=d.token;localStorage.setItem('t',T);U=d.user;render()}catch(e){$('#er').textContent=e.message}}
const ai=(id,fn)=>async()=>{const o=$('#'+id);o.textContent='AI đang phân tích…';try{o.textContent=await fn()}catch(e){o.textContent='Lỗi: '+e.message}};
const views={
async jobs(){const r=await api('/recommend');$('#m').innerHTML='<h3>Việc làm phù hợp với bạn</h3>'+(r.length?r.map(j=>`<div class="card"><div class="row"><div><b>${esc(j.title)}</b><div class="mut">${esc(j.company)} · ${esc(j.kind)}</div><p>${esc(j.description.slice(0,300))}</p>${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener">Tin gốc ↗</a> <span class="mut">${esc(j.source)}</span>`:""}
 ${j.matched.map(s=>`<span class="tag ok">✓ ${esc(s)}</span>`).join('')}${j.missing.map(s=>`<span class="tag no">✗ ${esc(s)}</span>`).join('')}</div>
 <div style="max-width:120px;text-align:center"><div class="score">${j.score}%</div><div class="bar"><i style="width:${j.score}%"></i></div><button style="margin-top:8px" onclick="applyJ(${j.id})">Ứng tuyển</button></div></div></div>`).join(''):'<div class="card">Chưa có tin tuyển dụng.</div>')+'<p class="mut">Cập nhật kỹ năng trong tab Hồ sơ để tăng độ chính xác.</p>'},
async profile(){$('#m').innerHTML=`<div class="card"><h3>Hồ sơ năng lực</h3><label>Họ tên</label><input id="n" value="${esc(U.name)}">
 <label>Kỹ năng (phân tách bằng dấu phẩy)</label><input id="s" value="${esc(U.skills)}" placeholder="python, sql, git">
 <label>Mục tiêu nghề nghiệp</label><input id="g" value="${esc(U.goal)}" placeholder="Data Analyst">
 <label>Giới thiệu bản thân</label><textarea id="b">${esc(U.bio)}</textarea><button onclick="saveP()">Lưu</button> <span id="ok" class="ok"></span></div>
 ${U.role=='student'?`<div class="card"><h3>CV của bạn</h3><p>${U.cv?'Đã tải lên: <b>'+esc(U.cv)+'</b> <button class="g" onclick="dlCV(\'/me/cv\')">Tải xuống</button>':'Chưa có CV.'}</p><input type="file" id="cvf" accept=".pdf,.docx,.txt"><button onclick="upCV()">Tải lên CV (PDF/DOCX/TXT, tối đa 5MB)</button><p class="mut">Nội dung CV được dùng để cải thiện độ chính xác gợi ý.</p></div>`:''}`},
async cv(){$('#m').innerHTML=`<div class="card"><h3>Hoàn thiện CV / Portfolio</h3><textarea id="t" placeholder="Dán nội dung CV vào đây"></textarea><button onclick="runCV()">Phân tích CV</button><div id="o" class="out" style="margin-top:12px"></div></div>`},
async skill(){$('#m').innerHTML=`<div class="card"><h3>Kỹ năng cần bổ sung</h3><input id="t" value="${esc(U.goal)}" placeholder="Mục tiêu nghề, vd: Backend Developer"><button onclick="runSkill()">Phân tích & lập lộ trình</button><div id="o" class="out" style="margin-top:12px"></div></div>`},
async interview(){H=[];$('#m').innerHTML=`<div class="card"><h3>Mô phỏng phỏng vấn</h3><div class="row"><input id="r" placeholder="Vị trí, vd: Thực tập sinh Data Analyst"><button style="flex:0" onclick="startI()">Bắt đầu</button></div>
 <div id="chat"></div><div id="ia" style="display:none"><textarea id="a" placeholder="Câu trả lời của bạn"></textarea><button onclick="sendI()">Gửi</button></div></div>`},
async apps(){const r=await api('/applications');$('#m').innerHTML='<h3>Đơn ứng tuyển của tôi</h3>'+(r.length?r.map(a=>`<div class="card row"><div><b>${esc(a.job.title)}</b><div class="mut">${esc(a.job.company)} · nộp ngày ${a.created}</div></div><div style="flex:0;white-space:nowrap"><span class="tag">${esc(a.status)}</span></div></div>`).join(''):'<div class="card">Bạn chưa ứng tuyển vị trí nào.</div>')},
async account(){$('#m').innerHTML=`<div class="card"><h3>Đổi mật khẩu</h3><label>Mật khẩu hiện tại</label><input id="o" type="password"><label>Mật khẩu mới</label><input id="n2" type="password"><button onclick="chpw()">Đổi mật khẩu</button> <span id="ok2"></span></div>`},
async trends(){$('#m').innerHTML='<div class="card"><h3>Xu hướng thị trường</h3><div id="o" class="out">AI đang phân tích…</div></div>';
 const d=await api('/ai/trends','POST');const mx=d.top_skills[0]?.[1]||1;
 $('#o').innerHTML=d.top_skills.map(([k,v])=>`<div>${esc(k)} <span class="mut">(${v})</span><div class="bar"><i style="width:${100*v/mx}%"></i></div></div>`).join('')+'<hr>'+esc(d.result)},
async myjobs(){const js=await api('/jobs');const mine=U.role=='admin'?js:js.filter(j=>j.employer_id==U.id);
 $('#m').innerHTML=`<div class="card"><h3>Đăng tin tuyển dụng</h3><div class="row"><input id="jt" placeholder="Vị trí"><input id="jc" placeholder="Công ty"><select id="jk"><option>Thực tập</option><option>Toàn thời gian</option><option>Bán thời gian</option></select></div>
 <input id="js" placeholder="Kỹ năng yêu cầu: python, sql, ..."><textarea id="jd" placeholder="Mô tả công việc"></textarea><button onclick="addJ()">Đăng tin</button></div>
 ${mine.map(j=>`<div class="card"><div class="row"><div><b>${esc(j.title)}</b> <span class="mut">${esc(j.company)} · ${esc(j.kind)}</span><br>${esc(j.skills)}</div>
 <div style="flex:0;white-space:nowrap"><button class="g" onclick="appl(${j.id})">Đơn ứng tuyển</button> <button class="g" onclick="cands(${j.id})">Ứng viên phù hợp</button> <button class="g" onclick="delJ(${j.id})">Xóa</button></div></div><div id="c${j.id}"></div></div>`).join('')}`},
async users(){const [u,s]=await Promise.all([api('/admin/users'),api('/admin/stats')]);
 $('#m').innerHTML=`<div class="card"><b>Nhập dữ liệu việc làm</b><p class="mut">Nhập tin thật từ Remotive hoặc file CSV (cột: title,company,kind,skills,description,url)</p><button onclick="impR()">Nhập tin từ Remotive</button> <input type="file" id="csvf" accept=".csv" style="width:auto"><button class="g" onclick="impC()">Nhập CSV</button> <span id="imo" class="mut"></span></div><div class="card">Sinh viên: <b>${s.students}</b> · Doanh nghiệp: <b>${s.employers}</b> · Tin tuyển dụng: <b>${s.jobs}</b></div><div class="card"><table><tr><th>Tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr>
 ${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td><td>${x.active?'Hoạt động':'Đã khóa'}</td><td>${x.id==U.id?'':`<button class="g" onclick="tg(${x.id})">${x.active?'Khóa':'Mở'}</button> <button class="g" onclick="dU(${x.id})">Xóa</button>`}</td></tr>`).join('')}</table></div>`}};
let H=[],role='';
async function saveP(){U=await api('/me','PUT',{name:$('#n').value,skills:$('#s').value,goal:$('#g').value,bio:$('#b').value});$('#ok').textContent='Đã lưu ✓'}
const runCV=ai('o',async()=>(await api('/ai/cv-review','POST',{text:$('#t').value})).result);
const runSkill=ai('o',async()=>(await api('/ai/skill-gap','POST',{text:$('#t').value})).result);
function show(){$('#chat').innerHTML=H.map(m=>`<div class="card out"><b>${m.who}:</b> ${esc(m.text)}</div>`).join('');$('#ia').style.display='block'}
async function startI(){role=$('#r').value||'Thực tập sinh';H=[];$('#chat').textContent='Đang tạo câu hỏi…';try{const d=await api('/ai/interview','POST',{role_name:role});H.push({who:'Nhà tuyển dụng',text:d.result});show()}catch(e){$('#chat').textContent=e.message}}
async function sendI(){const a=$('#a').value;if(!a)return;try{const d=await api('/ai/interview','POST',{role_name:role,history:H,answer:a});H.push({who:'Ứng viên',text:a},{who:'Nhà tuyển dụng',text:d.result});show();$('#a').value=''}catch(e){alert(e.message)}}
async function addJ(){await api('/jobs','POST',{title:$('#jt').value,company:$('#jc').value,kind:$('#jk').value,skills:$('#js').value,description:$('#jd').value});render()}
async function delJ(i){if(confirm('Xóa tin này?')){await api('/jobs/'+i,'DELETE');render()}}
async function cands(i){const r=await api('/candidates/'+i);$('#c'+i).innerHTML=r.length?'<table>'+r.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.skills)}</td><td><b>${c.score}%</b></td></tr>`).join('')+'</table>':'<p class="mut">Chưa có ứng viên.</p>'}
async function tg(i){await api('/admin/users/'+i+'/toggle','POST');render()}
async function dU(i){if(confirm('Xóa người dùng?')){await api('/admin/users/'+i,'DELETE');render()}}
const STATUS=['Đã nộp','Đang xem xét','Phỏng vấn','Trúng tuyển','Từ chối'];
async function applyJ(i){const n=prompt('Lời nhắn gửi nhà tuyển dụng (có thể bỏ trống)');if(n===null)return;try{await api('/apply/'+i,'POST',{text:n});alert('Đã nộp hồ sơ ✓');go('apps')}catch(e){alert(e.message)}}
async function appl(i){const r=await api('/jobs/'+i+'/applicants');$('#c'+i).innerHTML=r.length?'<table>'+r.map(a=>`<tr><td><b>${esc(a.name)}</b><br><span class="mut">${esc(a.email)}</span></td><td>${esc(a.skills)}<br><span class="mut">${esc(a.note)}</span></td><td><button class="g" onclick="dlCV('/applications/${a.id}/cv')">Tải CV</button></td><td><select onchange="setSt(${a.id},this.value)">${STATUS.map(s=>`<option ${s==a.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</table>':'<p class="mut">Chưa có đơn ứng tuyển.</p>'}
async function setSt(id,s){try{await api('/applications/'+id+'/status','PUT',{status:s})}catch(e){alert(e.message)}}
async function dlCV(p){const r=await fetch('/api'+p,{headers:{Authorization:'Bearer '+T}});if(!r.ok){alert('Không tải được CV');return}const b=await r.blob();const m=(r.headers.get('content-disposition')||'').match(/''(.+)$/);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=m?decodeURIComponent(m[1]):'cv';a.click()}
async function upCV(){const f=$('#cvf').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/api/me/cv',{method:'POST',headers:{Authorization:'Bearer '+T},body:fd});const d=await r.json();if(!r.ok){alert(d.detail);return}U=d;render()}
async function chpw(){const o=$('#ok2');try{await api('/change-password','POST',{old:$('#o').value,new:$('#n2').value});o.className='ok';o.textContent='Đã đổi mật khẩu ✓'}catch(e){o.className='no';o.textContent=e.message}}
function forgotView(){$('#app').innerHTML=`<div class="card auth"><h3>Quên mật khẩu</h3><label>Email</label><input id="e" type="email"><div id="er"></div><button style="width:100%" onclick="sendF()">Gửi liên kết đặt lại</button><p class="mut" style="text-align:center;cursor:pointer" onclick="authView()">Quay lại đăng nhập</p></div>`}
async function sendF(){try{await api('/forgot','POST',{email:$('#e').value});$('#er').innerHTML='<p class="ok">Nếu email tồn tại, liên kết đặt lại đã được gửi (hiệu lực 30 phút).</p>'}catch(e){$('#er').innerHTML='<p class="no">'+esc(e.message)+'</p>'}}
function resetView(){$('#app').innerHTML=`<div class="card auth"><h3>Đặt mật khẩu mới</h3><label>Mật khẩu mới</label><input id="p" type="password"><div id="er" class="no"></div><button style="width:100%" onclick="sendR()">Đổi mật khẩu</button></div>`}
async function sendR(){try{await api('/reset','POST',{token:location.hash.slice(7),password:$('#p').value});location.hash='';reg=false;authView();alert('Đổi mật khẩu thành công, hãy đăng nhập')}catch(e){$('#er').textContent=e.message}}
async function impR(){$('#imo').textContent='Đang nhập…';try{const d=await api('/admin/import-remote','POST');$('#imo').textContent='Đã thêm '+d.added+' tin'}catch(e){$('#imo').textContent=e.message}}
async function impC(){const f=$('#csvf').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/api/admin/import-csv',{method:'POST',headers:{Authorization:'Bearer '+T},body:fd});const d=await r.json();$('#imo').textContent=r.ok?'Đã thêm '+d.added+' tin':d.detail}
render();
</script></body></html>
